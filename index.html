<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/main.css" />
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="stylesheet" href="./css/mobile.css" />
    <title>Quadro de cursos</title>
  </head>

  <body>
    <div class="main">
      <img src="./img/1.png" class="thumbnail thumbnail-1" alt="" />
      <img src="./img/2.png" class="thumbnail thumbnail-2" alt="" />
      <img src="./img/3.png" class="thumbnail thumbnail-3" alt="" />
      <img src="./img/4.png" class="thumbnail thumbnail-4" alt="" />
      <img src="./img/5.png" class="thumbnail thumbnail-5" alt="" />
      <img src="./img/6.png" class="thumbnail thumbnail-6" alt="" />
      <img src="./img/7.png" class="thumbnail thumbnail-7" alt="" />
      <img src="./img/8.png" class="thumbnail thumbnail-8" alt="" />
      <img src="./img/9.png" class="thumbnail thumbnail-9" alt="" />
      <img src="./img/10.png" class="thumbnail thumbnail-10" alt="" />
      <img src="./img/11.png" class="thumbnail thumbnail-11" alt="" />
      <img src="./img/12.png" class="thumbnail thumbnail-12" alt="" />
      <img src="./img/13.png" class="thumbnail thumbnail-13" alt="" />
      <img src="./img/14.png" class="thumbnail thumbnail-14" alt="" />
      <img src="./img/15.png" class="thumbnail thumbnail-15" alt="" />
      <img src="./img/16.png" class="thumbnail thumbnail-16" alt="" />
      <img src="./img/17.png" class="thumbnail thumbnail-17" alt="" />
      <img src="./img/18.png" class="thumbnail thumbnail-18" alt="" />
    </div>

    <!-- Modal -->
    <div
      id="myModal"
      class="modal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="modal-title"
      aria-hidden="true"
    >
      <div class="modal-wrapper">
        <button class="close" type="button" aria-label="Fechar">&times;</button>
        <div class="modal-header">
          <div id="modal-index"></div>
          <h2 id="modal-title"></h2>
        </div>
        <div class="modal-content">
          <p id="modal-text"></p>
          <a id="modal-link" href="#" target="_blank" rel="noopener noreferrer">
            Acesse o link
          </a>
        </div>
      </div>
    </div>

    <!-- Overlay com GIF de rotação -->
    <div id="rotate-warning">
      <img src="./img/turn.gif" alt="Por favor, rotacione a tela para horizontal" />
    </div>

    <script src="./js/main.js"></script>
    <script src="./js/libs/scorm_api.js"></script>
    <script src="./js/scormConfig.js"></script>
    <!-- <script src="./js/utils.js"></script> -->
  </body>
</html>
